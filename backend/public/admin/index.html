<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Wallet admin</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #12202b;
        --muted: #5b6b76;
        --line: #d7e0e6;
        --bg: #f4f7f8;
        --card: #fff;
        --accent: #0f6c5c;
        --warn: #8a4b12;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        padding: 1.25rem 1.5rem;
        background: var(--ink);
        color: #fff;
      }
      header p { margin: 0.35rem 0 0; color: #c9d6de; }
      main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
      .banner {
        background: #fff4e5;
        color: var(--warn);
        padding: 0.75rem 1rem;
        border: 1px solid #f0d3a8;
        border-radius: 8px;
        margin-bottom: 1rem;
      }
      .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: end; margin: 0.75rem 0; }
      label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.85rem; color: var(--muted); }
      input {
        padding: 0.45rem 0.55rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        min-width: 12rem;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: 0;
        padding: 0.55rem 0.9rem;
        border-radius: 6px;
        cursor: pointer;
      }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1rem;
      }
      .card strong { display: block; font-size: 1.4rem; margin-top: 0.35rem; }
      table { width: 100%; border-collapse: collapse; background: var(--card); }
      th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
      h2 { margin-top: 1.75rem; }
      .err { color: #9b1c1c; }
      .panel { padding: 1.25rem; margin: 1rem 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
      [hidden] { display: none !important; }
      .account-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.5rem 1rem; align-items: end; }
      .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; vertical-align: middle; }
    </style>
  </head>
  <body>
    <header>
      <h1>Campus Wallet admin</h1>
    </header>
    <main>
      <section id="login" class="panel">
        <h2>Welcome back</h2>
        <div class="row">
          <label>ID <input id="loginId" autocomplete="username" value="ADMIN" /></label>
          <label>Password <input id="loginPassword" type="password" autocomplete="current-password" /></label>
          <button id="signIn">Continue</button>
        </div>
      </section>
      <p id="status" class="err" aria-live="polite"></p>
      <section id="dashboard" hidden>
        <div class="row"><h2>Account management</h2><button id="signOut">Sign out</button></div>
        <div class="cards" id="summary"></div>
        <section class="panel">
          <h2 id="formTitle">Add account</h2>
          <div class="account-form">
            <label>Account type <select id="accountRole"><option value="student">Student</option><option value="merchant">Canteen</option></select></label>
            <label>ID <input id="accountId" autocomplete="off" /></label>
            <label>Name <input id="accountName" autocomplete="off" /></label>
            <label>Password / PIN <input id="accountPin" type="password" autocomplete="new-password" /></label>
            <label>Profile photo <input id="accountPhoto" type="file" accept="image/jpeg,image/png,image/webp" /></label>
            <input id="photoData" type="hidden" />
            <img id="photoPreview" class="avatar" alt="Profile photo preview" hidden />
            <div class="row"><button id="saveAccount">Save account</button><button id="cancelEdit" hidden>Cancel edit</button></div>
          </div>
        </section>
        <h2>Accounts</h2>
        <div style="overflow-x:auto"><table><thead><tr><th>Photo</th><th>Type</th><th>ID</th><th>Name</th><th>Frozen</th><th>Balance</th><th></th></tr></thead><tbody id="accounts"></tbody></table></div>
        <h2>Recent ledger</h2>
        <div style="overflow-x:auto"><table><thead><tr><th>When</th><th>Account</th><th>Type</th><th>Paise</th><th>Note</th></tr></thead><tbody id="ledger"></tbody></table></div>
      </section>
    </main>
    <script>
      const rupees = (paise) => "₹" + (Number(paise) / 100).toFixed(2);
      const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
      let adminToken = localStorage.getItem("cw_admin_token") || "";
      let accountRows = [];
      let editingId = "";

      async function api(path, options = {}) {
        const res = await fetch(path, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(adminToken ? { Authorization: `Bearer ${adminToken}` } : {}),
            ...(options.headers || {}),
          },
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || res.statusText);
        return data;
      }

      async function load() {
        const status = document.getElementById("status");
        status.textContent = "";
        try {
          const summary = await api("/admin/summary");
          document.getElementById("summary").innerHTML = [
            ["Students", summary.students],
            ["Merchants", summary.merchants],
            ["Frozen", summary.frozen],
            ["Top-ups", rupees(summary.testTopupsPaise)],
            ["QR sales", rupees(summary.qrSalesPaise)],
          ]
            .map(([k, v]) => `<div class="card">${k}<strong>${v}</strong></div>`)
            .join("");
          const accounts = await api("/admin/accounts");
          accountRows = accounts.accounts;
          document.getElementById("accounts").innerHTML = accounts.accounts
            .map(
              (a) => `<tr>
                <td>${a.photoData ? `<img class="avatar" src="${a.photoData}" alt="">` : ""}</td>
                <td>${a.role === "merchant" ? "Canteen" : "Student"}</td>
                <td>${esc(a.collegeId)}</td>
                <td>${esc(a.name)}</td>
                <td>${a.frozen ? "yes" : "no"}</td>
                <td>${rupees(a.balancePaise)}</td>
                <td><button data-edit="${esc(a.collegeId)}">Edit</button> <button data-id="${esc(a.collegeId)}" data-frozen="${a.frozen ? "0" : "1"}">${a.frozen ? "Unfreeze" : "Freeze"}</button></td>
              </tr>`
            )
            .join("");
          const ledger = await api("/admin/ledger");
          document.getElementById("ledger").innerHTML = ledger.entries
            .map(
              (e) => `<tr>
                <td>${new Date(e.created_at).toLocaleString()}</td>
                <td>${e.college_id} (${e.role})</td>
                <td>${e.entry_type === "test_topup" ? "Top-up" : esc(e.entry_type)}</td>
                <td>${e.amount_paise}</td>
                <td>${e.entry_type === "test_topup" ? "" : e.note || ""}</td>
              </tr>`
            )
            .join("");
        } catch (err) {
          status.textContent = err.message;
        }
      }

      function resetForm() {
        editingId = "";
        document.getElementById("formTitle").textContent = "Add account";
        document.getElementById("accountRole").disabled = false;
        document.getElementById("accountId").value = "";
        document.getElementById("accountName").value = "";
        document.getElementById("accountPin").value = "";
        document.getElementById("accountPhoto").value = "";
        document.getElementById("photoData").value = "";
        document.getElementById("photoPreview").hidden = true;
        document.getElementById("saveAccount").textContent = "Save account";
        document.getElementById("cancelEdit").hidden = true;
      }

      document.getElementById("signIn").onclick = async () => {
        const status = document.getElementById("status");
        status.textContent = "";
        try {
          const response = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ collegeId: document.getElementById("loginId").value.trim(), pin: document.getElementById("loginPassword").value }),
          });
          const data = await response.json();
          if (!response.ok || data.role !== "admin") throw new Error(data.error || "Invalid ID or password");
          adminToken = data.token;
          localStorage.setItem("cw_admin_token", adminToken);
          document.getElementById("login").hidden = true;
          document.getElementById("dashboard").hidden = false;
          await load();
        } catch (err) {
          status.textContent = err.message;
        }
      };
      document.getElementById("loginPassword").onkeydown = (event) => { if (event.key === "Enter") document.getElementById("signIn").click(); };
      document.getElementById("signOut").onclick = () => {
        adminToken = "";
        localStorage.removeItem("cw_admin_token");
        document.getElementById("dashboard").hidden = true;
        document.getElementById("login").hidden = false;
      };
      document.getElementById("accountPhoto").onchange = async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        try {
          const image = await createImageBitmap(file);
          const scale = Math.min(1, 320 / Math.max(image.width, image.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(image.width * scale);
          canvas.height = Math.round(image.height * scale);
          canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
          image.close();
          const data = canvas.toDataURL("image/jpeg", 0.78);
          document.getElementById("photoData").value = data;
          document.getElementById("photoPreview").src = data;
          document.getElementById("photoPreview").hidden = false;
        } catch (err) {
          document.getElementById("status").textContent = "Could not process this photo.";
        }
      };
      document.getElementById("accounts").onclick = async (event) => {
        const edit = event.target.closest("button[data-edit]");
        if (edit) {
          const account = accountRows.find((row) => row.collegeId === edit.dataset.edit);
          if (!account) return;
          editingId = account.collegeId;
          document.getElementById("formTitle").textContent = `Edit ${account.collegeId}`;
          document.getElementById("accountRole").value = account.role;
          document.getElementById("accountRole").disabled = Boolean(account.balancePaise);
          document.getElementById("accountId").value = account.collegeId;
          document.getElementById("accountName").value = account.name;
          document.getElementById("accountPin").value = "";
          document.getElementById("photoData").value = account.photoData || "";
          document.getElementById("photoPreview").src = account.photoData || "";
          document.getElementById("photoPreview").hidden = !account.photoData;
          document.getElementById("saveAccount").textContent = "Save changes";
          document.getElementById("cancelEdit").hidden = false;
          document.getElementById("formTitle").scrollIntoView({ behavior: "smooth" });
          return;
        }
        const btn = event.target.closest("button[data-id]");
        if (!btn) return;
        try {
          await api("/admin/freeze", { method: "POST", body: JSON.stringify({ collegeId: btn.dataset.id, frozen: btn.dataset.frozen === "1" }) });
          await load();
        } catch (err) { document.getElementById("status").textContent = err.message; }
      };
      document.getElementById("cancelEdit").onclick = resetForm;
      document.getElementById("saveAccount").onclick = async () => {
        const body = {
          collegeId: document.getElementById("accountId").value.trim(),
          role: document.getElementById("accountRole").value,
          name: document.getElementById("accountName").value.trim(),
          pin: document.getElementById("accountPin").value,
          photoData: document.getElementById("photoData").value || null,
        };
        if (editingId) body.originalCollegeId = editingId;
        try {
          await api("/admin/accounts", { method: editingId ? "PATCH" : "POST", body: JSON.stringify(body) });
          resetForm();
          await load();
        } catch (err) { document.getElementById("status").textContent = err.message; }
      };
    </script>
  </body>
</html>
