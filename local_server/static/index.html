<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Wallet (test mode)</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div>
          <p class="kicker">College closed-loop · local test</p>
          <h1>Campus Wallet</h1>
        </div>
        <span class="pill">Not real money</span>
      </header>

      <p id="flash" class="flash" hidden></p>

      <section id="view-home" class="panel">
        <p class="lede">
          Recharge with test rupees, pay the canteen by QR text. Demo IDs only — STU1001 and CANTEEN1, PIN 1234.
        </p>
        <div class="roles">
          <button data-go="student-auth">Student</button>
          <button class="ghost" data-go="merchant-auth">Canteen</button>
          <button class="ghost" data-go="admin">Admin</button>
        </div>
      </section>

      <section id="view-student-auth" class="panel" hidden>
        <button class="back" data-go="home">← Home</button>
        <h2>Student</h2>
        <label>College ID <input id="s-id" value="STU1001" /></label>
        <label>Name (signup) <input id="s-name" value="Alex Test" /></label>
        <label>PIN <input id="s-pin" type="password" value="1234" /></label>
        <div class="row">
          <button id="s-login">Log in</button>
          <button class="ghost" id="s-signup">Sign up</button>
        </div>
      </section>

      <section id="view-student" class="panel" hidden>
        <div class="row spread">
          <button class="back" id="s-out">Log out</button>
          <span id="s-who" class="muted"></span>
        </div>
        <p class="balance" id="s-bal">₹0.00</p>
        <p id="s-status" class="muted"></p>
        <div class="row">
          <button id="s-topup">Add ₹100 (test money)</button>
          <button class="ghost" id="s-freeze">Freeze</button>
        </div>
        <div class="qr-box">
          <img id="s-qr-img" alt="Pay QR" hidden />
          <p id="s-qr-text" class="token"></p>
          <button class="ghost" id="s-copy">Copy QR text</button>
        </div>
        <h3>History</h3>
        <ul id="s-ledger" class="ledger"></ul>
      </section>

      <section id="view-merchant-auth" class="panel" hidden>
        <button class="back" data-go="home">← Home</button>
        <h2>Canteen</h2>
        <label>Merchant ID <input id="m-id" value="CANTEEN1" /></label>
        <label>PIN <input id="m-pin" type="password" value="1234" /></label>
        <button id="m-login">Log in</button>
      </section>

      <section id="view-merchant" class="panel" hidden>
        <div class="row spread">
          <button class="back" id="m-out">Log out</button>
          <span id="m-who" class="muted"></span>
        </div>
        <p class="balance" id="m-bal">₹0.00</p>
        <label>Student QR text <textarea id="m-token" rows="3"></textarea></label>
        <label>Charge (₹) <input id="m-amt" value="40" /></label>
        <button id="m-charge">Charge (test)</button>
        <h3>Sales</h3>
        <ul id="m-ledger" class="ledger"></ul>
      </section>

      <section id="view-admin" class="panel" hidden>
        <button class="back" data-go="home">← Home</button>
        <h2>Admin</h2>
        <label>Admin key <input id="a-key" type="password" value="change-me-admin-key" /></label>
        <button id="a-load">Load dashboard</button>
        <div id="a-cards" class="cards"></div>
        <h3>New merchant</h3>
        <div class="row">
          <label>ID <input id="a-mid" value="CANTEEN2" /></label>
          <label>Name <input id="a-mname" value="South Stall (demo)" /></label>
          <label>PIN <input id="a-mpin" value="1234" /></label>
          <button id="a-create">Create</button>
        </div>
        <div id="a-tables"></div>
      </section>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
