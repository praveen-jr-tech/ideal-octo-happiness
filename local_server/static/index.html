<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Wallet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/app.css?v=20261002-5" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div>
          <h1>Campus Wallet</h1>
        </div>
      </header>

      <p id="flash" class="flash" hidden></p>

      <section id="view-home" class="panel">
        <h2>Welcome back</h2>
        <p class="lede">Sign in to your campus wallet.</p>
        <label>ID <input id="login-id" autocomplete="username" /></label>
        <label>Password <input id="login-password" type="password" autocomplete="current-password" /></label>
        <button id="login-submit" type="button">Continue</button>
      </section>

      <section id="view-student-auth" class="panel" hidden>
        <button class="back" data-go="home">← Home</button>
        <h2>Student</h2>
        <label>College ID <input id="s-id" value="STU1001" /></label>
        <label>Name (signup) <input id="s-name" value="Alex" /></label>
        <label>PIN <input id="s-pin" type="password" value="1234" /></label>
        <div class="row">
          <button id="s-login">Log in</button>
          <button class="ghost" id="s-signup">Sign up</button>
        </div>
      </section>

      <section id="view-student" class="panel" hidden>
        <div class="row spread">
          <button class="back" id="s-out">Log out</button>
          <img id="s-profile-photo" class="profile-photo" alt="Student profile photo" hidden />
          <span id="s-who" class="muted"></span>
        </div>
        <p class="balance" id="s-bal">₹0.00</p>
        <p id="s-status" class="muted"></p>
        <div class="row">
          <button id="s-topup">Add ₹100</button>
          <button class="ghost" id="s-freeze">Freeze</button>
        </div>
        <div class="qr-box">
          <img id="s-qr-img" alt="Pay QR" hidden />
          <p id="s-qr-text" class="token"></p>
          <button class="ghost" id="s-copy">Copy QR text</button>
        </div>
        <h3>History</h3>
        <ul id="s-ledger" class="ledger"></ul>
      </section>

      <section id="view-merchant-auth" class="panel" hidden>
        <button class="back" data-go="home">← Home</button>
        <h2>Canteen</h2>
        <label>Merchant ID <input id="m-id" value="CANTEEN1" /></label>
        <label>PIN <input id="m-pin" type="password" value="1234" /></label>
        <button id="m-login">Log in</button>
      </section>

      <section id="view-merchant" class="panel" hidden>
        <div class="row spread">
          <button class="back" id="m-out">Log out</button>
          <span id="m-who" class="muted"></span>
        </div>
        <p class="balance" id="m-bal">₹0.00</p>
        <div class="scan-tools">
          <div class="row">
            <button class="ghost" id="m-scan-start" type="button">Scan QR</button>
            <button class="ghost" id="m-scan-stop" type="button" hidden>Stop camera</button>
          </div>
          <input id="m-camera-file" type="file" accept="image/*" capture="environment" hidden />
          <video id="m-camera" playsinline muted hidden></video>
          <p id="m-scan-status" class="muted" aria-live="polite">Scan the student's QR, then confirm the amount before charging.</p>
        </div>
        <label>Student QR text <textarea id="m-token" rows="3"></textarea></label>
        <label>Charge (₹) <input id="m-amt" value="40" /></label>
        <button id="m-charge">Charge</button>
        <h3>Sales</h3>
        <ul id="m-ledger" class="ledger"></ul>
      </section>

      <section id="view-admin" class="panel" hidden>
        <div class="row spread">
          <h2>Account management</h2>
          <button class="back" id="a-out">Log out</button>
        </div>
        <div id="a-cards" class="cards"></div>
        <h3 id="a-form-title">Add account</h3>
        <div class="account-form">
          <label>Account type
            <select id="a-role"><option value="student">Student</option><option value="merchant">Canteen</option></select>
          </label>
          <label>ID <input id="a-id" autocomplete="off" /></label>
          <label>Name <input id="a-name" autocomplete="off" /></label>
          <label>Password / PIN <input id="a-pin" type="password" autocomplete="new-password" /></label>
          <label>Profile photo <input id="a-photo" type="file" accept="image/jpeg,image/png,image/webp" /></label>
          <input id="a-photo-data" type="hidden" />
          <img id="a-photo-preview" class="profile-photo preview-photo" alt="Profile photo preview" hidden />
          <div class="row">
            <button id="a-save" type="button">Save account</button>
            <button id="a-cancel" class="ghost" type="button" hidden>Cancel edit</button>
          </div>
        </div>
        <div id="a-tables"></div>
      </section>
    </div>
    <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="/static/app.js?v=20261002-5"></script>
  </body>
</html>
