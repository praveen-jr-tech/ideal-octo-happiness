services:
  - type: web
    name: campus-wallet-api
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TEST_MODE
        value: "true"
      - key: QR_TTL_SECONDS
        value: "45"
      - key: DATABASE_URL
        fromDatabase:
          name: campus-wallet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true

databases:
  - name: campus-wallet-db
    databaseName: campus_wallet
    user: campus
    plan: free
